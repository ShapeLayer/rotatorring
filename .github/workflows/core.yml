name: Shared core
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  portable-core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: C and .NET interop tests
        run: dotnet run --project tests/dotnet/CoreInterop -c Release
      - name: Swift adapter tests
        if: runner.os == 'macOS'
        run: swift test
      - name: macOS Release build
        if: runner.os == 'macOS'
        run: swift build -c release
